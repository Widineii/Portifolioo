    <text x="55" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a78bfa" font-weight="600">Java </text>
  </g>
  <g transform="translate(200, 500)">
    <rect width="150" height="40" rx="20" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
    <text x="75" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a78bfa" font-weight="600">Spring Boot <C</text>
  </g>
  <g transform="translate(360, 500)">
    <rect width="110" height="40" rx="20" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
    <text x="55" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a78bfa" font-weight="600">Node.js</text>
  </g>
  <g transform="translate(480, 500)">
