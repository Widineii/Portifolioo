    <text x="100" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b6b80">localhost:8080/api</text>

    <!-- Code -->
    <g transform="translate(24, 70)">
      <text font-family="'JetBrains Mono', monospace" font-size="14" fill="#c586c0">@RestController</text>
      <text y="28" font-family="'JetBrains Mono', monospace" font-size="14">
        <tspan fill="#c586c0">public class</tspan>
        <tspan fill="#4ec9b0"> ApiController</tspan>
        <tspan fill="#d4d4d4"> {</tspan>
      </text>
      <text y="56" x="20" font-family="'JetBrains Mono', monospace" font-size="14">
        <tspan fill="#c586c0">@GetMapping</tspan>
        <tspan fill="#d4d4d4">(</tspan>
        <tspan fill="#ce9178">"/users"</tspan>
        <tspan fill="#d4d4d4">)</tspan>
      </text>
      <text y="84" x="20" font-family="'JetBrains Mono', monospace" font-size="14">
        <tspan fill="#c586c0">public</tspan>
        <tspan fill="#4ec9b0"> List</tspan>
        <tspan fill="#d4d4d4">&lt;</tspan>
        <tspan fill="#4ec9b0">User</tspan>
        <tspan fill="#d4d4d4">&gt; </tspan>
        <tspan fill="#dcdcaa">getAll</tspan>
        <tspan fill="#d4d4d4">() {</tspan>
      </text>
      <text y="112" x="40" font-family="'JetBrains Mono', monospace" font-size="14">
        <tspan fill="#c586c0">return</tspan>
        <tspan fill="#d4d4d4"> userService.</tspan>
        <tspan fill="#dcdcaa">findAll</tspan>
        <tspan fill="#d4d4d4">();</tspan>
      </text>
      <text y="140" x="20" font-family="'JetBrains Mono', monospace" font-size="14" fill="#d4d4d4">}</text>
      <text y="168" font-family="'JetBrains Mono', monospace" font-size="14" fill="#d4d4d4">}</text>
    </g>

    <!-- Floating badge -->
    <g transform="translate(280, 250)">
      <rect width="120" height="50" rx="12" fill="#1a1a25" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="18">¡</text>
      <text x="40" y="22" font-family="'Space Grotesk', sans-serif" font-size="13" fill="white" font-weight="700">API REST</text>
      <text x="40" y="38" font-family="Inter, sans-serif" font-size="10" fill="#6b6b80">Spring Boot</text>
    </g>
  </g>

  <!-- Bottom URL -->
  <text x="80" y="590" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6b6b80">widineii.github.io/Portifolio</text>
