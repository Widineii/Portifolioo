  <text x="80" y="320" font-family="'Space Grotesk', sans-serif" font-size="48" fill="white" font-weight="700">Desenvolvedor</text>
  <text x="80" y="380" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="700">
    <tspan fill="#8b5cf6">Full Stack Java</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="Inter, sans-serif" font-size="22" fill="#a8a8b8">Sistemas Desktop · Sistemas Web · APIs · Sites Profissionais</text>

  <!-- Tech badges -->
  <g transform="translate(80, 500)">
